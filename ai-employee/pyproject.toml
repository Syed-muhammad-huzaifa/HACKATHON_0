[project]
name = "ai-employee"
version = "0.1.0"
description = "AI Employee Automation System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.0",
    "google-api-python-client>=2.99.0"
]

[project.scripts]
ai-watch = "app.cli.run_watcher:main"
ai-orchestrate = "app.cli.run_orchestrator:main"
ai-gmail-watch = "app.cli.run_gmail_watcher:main"

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
